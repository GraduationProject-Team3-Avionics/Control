# MPC Position Controller Parameters
# MATLAB mpc_setup.m 기준값
mpc_position_controller_node:
  ros__parameters:
    # ─────────── Model ───────────
    mass: 2.0             # [kg] 기체 질량 (x500)
    gravity: 9.81         # [m/s²]
    dt: 0.05              # [s] 샘플링 시간 (20 Hz)

    # ─────────── MPC Horizon ───────────
    prediction_horizon: 20  # 20 × 0.05 = 1.0 s

    # ─────────── Weight Matrices ───────────
    # Q: [px, py, pz, vx, vy, vz]
    Q_diag: [50.0, 50.0, 100.0, 5.0, 5.0, 5.0]
    # R: [φ_d, θ_d, ΔT]
    R_diag: [0.5, 0.5, 0.05]

    # ─────────── Constraints ───────────
    phi_max_deg: 30.0     # [deg] Roll 제한
    theta_max_deg: 30.0   # [deg] Pitch 제한
    v_max: 3.0            # [m/s] 속도 제한

    # ─────────── Thrust ───────────
    T_max: 39.24          # [N]  2 × T_hover (정규화 기준)
